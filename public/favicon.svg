<!-- The toque from the wordmark and the power-apps category icon, closed and
     filled. The site draws in thin strokes, but a 1.4-unit outline is a 0.7px
     hairline in a 16px tab, so the tab mark is a solid silhouette instead.
     viewBox is the measured bounding box (4–27.25 × 3.05–27.2) centred in a
     square, so the hat fills the tab cell instead of floating in it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.9 2.4 25.4 25.4">
	<path d="M8.4 16.2C5.6 15.8 3.7 13.4 4.1 10.8 4.5 8.3 6.9 6.6 9.5 7.1c.9-2.6 3.6-4.3 6.6-4 2.8.3 5.1 2.2 5.6 4.6 2.7-.3 5.2 1.6 5.5 4.3.3 2.5-1.4 4.8-4 5.3Z"/>
	<path d="M8.5 16.1c.4 3.5.5 7 .3 10.5 4.7.8 9.5.8 14.2 0-.3-3.5-.2-7 .2-10.5Z"/>
	<style>
		/* --color-paprika, and the dark-mode signal the site itself steps up to. */
		path { fill: #e04b3a; }
		@media (prefers-color-scheme: dark) {
			path { fill: #ff7a68; }
		}
	</style>
</svg>
